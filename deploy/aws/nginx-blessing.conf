# Flipkart-Grade Zero-Downtime Nginx Reverse Proxy Configuration
# Optimized for Next.js 15 App Router + High Availability Failover

upstream nextjs_upstream {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=5s;
    keepalive 32;
}

server {
    listen 80;
    server_name blessingpowerguide.duckdns.org default_server;

    # Dynamic compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_comp_level 5;
    gzip_min_length 256;

    # Client body limit for review image uploads
    client_max_body_size 25M;

    # Root proxy location with zero-downtime retry fallback
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Zero-Downtime Retries: If Next.js is restarting during deploy,
        # Nginx holds and retries the request for up to 5 seconds.
        # User NEVER sees 502 Bad Gateway!
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 5s;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static assets caching (_next/static)
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
