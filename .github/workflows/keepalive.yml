# Optional external ping so free/hobby hosts stay warm.
# Set repository variable KEEP_ALIVE_BASE_URL to the live origin
# (e.g. https://blessingpowerguide.in). No hardcoded Railway URL.

name: Keep-alive ping

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health + ready
        run: |
          BASE="${{ vars.KEEP_ALIVE_BASE_URL }}"
          if [ -z "$BASE" ]; then
            echo "SKIP: set repo variable KEEP_ALIVE_BASE_URL to enable keep-alive pings."
            exit 0
          fi
          BASE="${BASE%/}"
          echo "Pinging $BASE/api/health"
          curl -fsS --max-time 20 "$BASE/api/health" | head -c 400
          echo ""
          echo "Pinging $BASE/api/ready"
          curl -fsS --max-time 25 "$BASE/api/ready" | head -c 400
          echo ""
          echo "Keep-alive OK"
