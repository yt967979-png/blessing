name: CI — typecheck & lint

# Runs on every push/PR to main so bad TypeScript does not ship unnoticed.
# Full route smoke tests run on the VPS after redeploy (need live server + DB).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Pricing, Concurrency, Tracking SSE & Backup Restore Regression Tests
        run: |
          node scripts/test-pricing-rules.js
          node scripts/test-concurrency-stock-cas.js
          node scripts/test-concurrency-logic.js
          node scripts/test-idor-invoice-e2e.js
          node scripts/test-backup-restore-e2e.js
          node scripts/test-tracking-and-courier-sync.js

      - name: ESLint
        run: npm run lint
