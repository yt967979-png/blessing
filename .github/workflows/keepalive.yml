# Pings production every 5 minutes so Railway Free is less likely to go cold.
# Uses the public health endpoint (no secrets required).

name: Keep-alive ping

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health + ready
        run: |
          BASE="${{ vars.KEEP_ALIVE_BASE_URL }}"
          if [ -z "$BASE" ]; then
            BASE="https://blessing-production.up.railway.app"
          fi
          BASE="${BASE%/}"
          echo "Pinging $BASE/api/health"
          curl -fsS --max-time 20 "$BASE/api/health" | head -c 400 || true
          echo ""
          echo "Pinging $BASE/api/ready"
          curl -fsS --max-time 25 "$BASE/api/ready" | head -c 400 || true
          echo ""
